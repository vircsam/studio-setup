<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Tegaki Handwriting Animation</title>
  <!-- GSAP Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      transform-origin: 0 0;
    }
    .scene {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
    }
    
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@700&display=swap');
    
    .handwriting-wrapper {
      position: absolute;
      width: 1200px;
      height: 240px;
      pointer-events: none;
    }
    .flourish-path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      opacity: 0.85;
    }
    .handwritten-text {
      letter-spacing: 2px;
      will-change: stroke-dashoffset, fill;
    }


        .header-sub {
          position: absolute;
          left: 240px;
          top: 310px;
          font-family: monospace;
          color: #94a3b8;
          font-size: 24px;
          letter-spacing: 3px;
        }
        .footer-note {
          position: absolute;
          left: 240px;
          top: 600px;
          font-size: 26px;
          color: #64748b;
        }
    
  </style>
</head>
<body>
  <div id="tegaki_demo"
       class="stage"
       data-composition-id="tegaki_demo"
       data-start="0"
       data-duration="4.5"
       data-width="1920"
       data-height="1080">
    
    
    
        <div id="tegaki-sub" class="header-sub">TEGAKI × HYPERFRAMES</div>
        
    <div id="hw-title-wrap" class="handwriting-wrapper" style="left:220px; top:380px;">
      <svg class="handwriting-svg" viewBox="0 0 1200 240" width="1200" height="240">
        <!-- Underline flourishing stroke -->
        <path id="hw-title-flourish" class="flourish-path"
              d="M 10 180 Q 250 160 500 175 T 950 165"
              fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
        <!-- Handwritten typography -->
        <text id="hw-title-txt" class="handwritten-text"
              x="20" y="140"
              font-family="'Caveat', 'Dancing Script', cursive"
              font-size="82"
              fill="none"
              stroke="#38bdf8"
              stroke-width="3.5"
              stroke-dasharray="1400"
              stroke-dashoffset="1400">
          Handwriting from Real Fonts
        </text>
      </svg>
    </div>

        <div id="tegaki-foot" class="footer-note">Organic SVG stroke-order choreography with zero raster artifacts.</div>
    
    
    
  </div>

  <script>
    // HyperFrames deterministic timeline
    const tl = gsap.timeline({ paused: true });
    
    // Animate composition
    
        tl.from('#tegaki-sub', { opacity: 0, y: -15, duration: 0.6, ease: 'power2.out' }, 0.2);
    
    
    // Tegaki handwriting stroke reveal
    tl.to('#hw-title-txt', {
      strokeDashoffset: 0,
      duration: 2.6,
      ease: 'power1.inOut'
    }, 0.6);
    
    // Smooth ink fill transition
    tl.to('#hw-title-txt', {
      fill: '#38bdf8',
      duration: 0.91,
      ease: 'power2.out'
    }, 2.42);

    // Flourish underline accent
    tl.to('#hw-title-flourish', {
      strokeDashoffset: 0,
      duration: 1.3,
      ease: 'power2.out'
    }, 1.6400000000000001);

    
        tl.from('#tegaki-foot', { opacity: 0, y: 15, duration: 0.8, ease: 'power2.out' }, 2.8);
    
    
    // Register timeline with HyperFrames renderer hook
    window.__timelines = window.__timelines || {};
    window.__timelines['tegaki_demo'] = tl;
    window.__hyperframes_ready = true;
  </script>
</body>
</html>
