<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>HyperFrames Composition</title>
  <!-- GSAP Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      transform-origin: 0 0;
    }
    .video-stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .scene {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      z-index: 1;
    }
    
  </style>
</head>
<body>
  <div data-hf-id="hf-224f" id="preview"
       class="stage"
       data-composition-id="preview"
       data-start="0"
       data-duration="4.5"
       data-width="1920"
       data-height="1080">
    
    
    
    
    
    
  </div>

  <script>
    // HyperFrames deterministic timeline
    const tl = gsap.timeline({ paused: true });
    
    // Animate composition
    
    
    

    // Register timeline with HyperFrames renderer hook
    window.__timelines = window.__timelines || {};
    window.__timelines['preview'] = tl;
    window.__hyperframes_ready = true;
  </script>
</body>
</html>
