<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    body { margin: 0; width: 1280px; height: 720px; background: #0b0f19; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 64px; color: #38bdf8; }
  </style>
</head>
<body>
  <div id="test" data-composition-id="test" data-start="0" data-duration="2" data-width="1280" data-height="720">
    <h1 id="title">HyperFrames Ready</h1>
  </div>
  <script>
    const tl = gsap.timeline({paused: true});
    tl.from('#title', {scale: 0.5, opacity: 0, duration: 1, ease: 'back.out(1.7)'});
    window.__timelines = { test: tl };
  </script>
</body>
</html>
